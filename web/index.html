<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoClaw</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Animated background -->
  <div class="bg-animation">
    <canvas id="particles"></canvas>
  </div>

  <!-- LOGIN PAGE -->
  <div id="login-page" class="page active">
    <div class="login-container">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo">
          <svg viewBox="0 0 80 80" class="logo-svg">
            <defs>
              <linearGradient id="clawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6366f1"/>
                <stop offset="50%" style="stop-color:#8b5cf6"/>
                <stop offset="100%" style="stop-color:#a78bfa"/>
              </linearGradient>
            </defs>
            <circle cx="40" cy="40" r="35" fill="url(#clawGrad)" opacity="0.15"/>
            <path d="M25 50 C25 35, 30 20, 40 15 C35 25, 33 35, 35 50" stroke="url(#clawGrad)" stroke-width="3" fill="none" stroke-linecap="round" class="claw-path claw-1"/>
            <path d="M35 48 C35 33, 38 18, 45 12 C42 22, 40 32, 40 48" stroke="url(#clawGrad)" stroke-width="3" fill="none" stroke-linecap="round" class="claw-path claw-2"/>
            <path d="M45 48 C45 33, 42 18, 35 12 C38 22, 40 32, 40 48" stroke="url(#clawGrad)" stroke-width="3" fill="none" stroke-linecap="round" class="claw-path claw-3"/>
            <path d="M55 50 C55 35, 50 20, 40 15 C45 25, 47 35, 45 50" stroke="url(#clawGrad)" stroke-width="3" fill="none" stroke-linecap="round" class="claw-path claw-4"/>
            <circle cx="40" cy="55" r="8" fill="url(#clawGrad)" opacity="0.3" class="claw-palm"/>
          </svg>
        </div>
      </div>

      <h1 class="login-title">
        <span class="title-nano">Nano</span><span class="title-claw">Claw</span>
      </h1>
      <p class="login-subtitle">Personal AI Assistant Dashboard</p>

      <form id="login-form" class="login-form">
        <div class="input-group">
          <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
          <label for="password">Password</label>
          <div class="input-line"></div>
        </div>
        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Sign In</span>
          <div class="btn-loader"></div>
        </button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboard-page" class="page">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">
          <svg viewBox="0 0 80 80" width="28" height="28">
            <defs>
              <linearGradient id="clawGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6366f1"/>
                <stop offset="100%" style="stop-color:#a78bfa"/>
              </linearGradient>
            </defs>
            <circle cx="40" cy="40" r="35" fill="url(#clawGrad2)" opacity="0.2"/>
            <path d="M25 50 C25 35, 30 20, 40 15 C35 25, 33 35, 35 50" stroke="url(#clawGrad2)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M35 48 C35 33, 38 18, 45 12 C42 22, 40 32, 40 48" stroke="url(#clawGrad2)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M45 48 C45 33, 42 18, 35 12 C38 22, 40 32, 40 48" stroke="url(#clawGrad2)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M55 50 C55 35, 50 20, 40 15 C45 25, 47 35, 45 50" stroke="url(#clawGrad2)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </svg>
          <span class="topbar-title">NanoClaw</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status-pill" id="status-pill">
          <span class="status-dot"></span>
          <span class="status-text">Dashboard</span>
        </div>
        <button class="btn-logout" id="logout-btn" title="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="dashboard">

      <!-- Stat cards row -->
      <section class="stats-row">
        <div class="stat-card" style="--delay: 0.1s">
          <div class="stat-icon groups-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-number" id="stat-groups">0</span>
            <span class="stat-label">Groups</span>
          </div>
        </div>

        <div class="stat-card" style="--delay: 0.2s">
          <div class="stat-icon chats-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-number" id="stat-chats">0</span>
            <span class="stat-label">Chats Seen</span>
          </div>
        </div>

        <div class="stat-card" style="--delay: 0.3s">
          <div class="stat-icon tasks-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-number" id="stat-tasks">0</span>
            <span class="stat-label">Active Tasks</span>
          </div>
        </div>

        <div class="stat-card" style="--delay: 0.4s">
          <div class="stat-icon uptime-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-number" id="stat-uptime">--</span>
            <span class="stat-label">Uptime</span>
          </div>
        </div>
      </section>

      <!-- Two-column layout -->
      <section class="panels">
        <!-- Groups panel -->
        <div class="panel" style="--delay: 0.3s">
          <div class="panel-header">
            <h2>Registered Groups</h2>
            <span class="badge" id="groups-badge">0</span>
          </div>
          <div class="panel-body" id="groups-list">
            <div class="empty-state">No groups registered yet</div>
          </div>
        </div>

        <!-- Tasks panel -->
        <div class="panel" style="--delay: 0.4s">
          <div class="panel-header">
            <h2>Scheduled Tasks</h2>
            <span class="badge" id="tasks-badge">0</span>
          </div>
          <div class="panel-body" id="tasks-list">
            <div class="empty-state">No tasks scheduled</div>
          </div>
        </div>
      </section>

      <!-- Recent chats -->
      <section class="panel full-width" style="--delay: 0.5s">
        <div class="panel-header">
          <h2>Recent Activity</h2>
          <span class="badge" id="chats-badge">0</span>
        </div>
        <div class="panel-body scrollable" id="chats-list">
          <div class="empty-state">No activity yet</div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
